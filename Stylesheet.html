<style>
/* ════════════════════════════════════════════════════════
   SERENE HALAQAH — Design Tokens
   ════════════════════════════════════════════════════════ */
:root, [data-theme="light"] {
  --primary: #0f5238;
  --primary-container: #2d6a4f;
  --on-primary: #ffffff;
  --secondary-gold: #C5A059;
  --secondary-dark: #775a19;
  --secondary-container: #fed488;
  --leaf-green: #40916C;
  --sage-light: #E9F5EE;
  --bronze-muted: #8E7341;

  --bg-main: #F2F4F7;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FFFFFF;
  --surface-container: #edeeef;
  --surface-container-low: #f3f4f5;

  --text-primary: #191c1d;
  --text-secondary: #404943;
  --text-muted: #707973;
  --border-color: #E5E7EB;
  --border-color-soft: #e1e3e4;

  --danger: #ba1a1a;
  --danger-bg: #ffdad6;
  --warning: #775a19;
  --warning-bg: #fed488;
  --success: #0f5238;
  --success-bg: #a8e7c5;

  --shadow-float: 0 8px 24px rgba(15, 82, 56, 0.06);
  --shadow-float-hover: 0 12px 32px rgba(15, 82, 56, 0.1);

  --radius-sm: 0.5rem;
  --radius-md: 1rem;
  --radius-lg: 1.5rem;
  --radius-full: 9999px;

  --font-headline: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
}

[data-theme="dark"] {
  --primary: #95d4b3;
  --primary-container: #2d6a4f;
  --on-primary: #002114;
  --secondary-gold: #e9c176;
  --secondary-container: #5d4201;

  --bg-main: #14181a;
  --bg-card: #1c2224;
  --surface-container: #202728;
  --surface-container-low: #191f20;

  --text-primary: #e3e6e5;
  --text-secondary: #c1cac3;
  --text-muted: #8b9691;
  --border-color: #2e3a35;
  --border-color-soft: #2a3532;

  --danger: #ffb4ab;
  --danger-bg: #4d1210;
  --success: #95d4b3;
  --success-bg: #0e3d29;

  --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.25);
  --shadow-float-hover: 0 12px 32px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
*, *::before, *::after { transition: background-color .25s ease, color .25s ease, border-color .25s ease; }

body {
  font-family: var(--font-body);
  background: var(--bg-main);
  color: var(--text-primary);
  margin: 0;
  overflow-x: hidden;
}

h1, h2, h3, h4, h5, h6 { font-family: var(--font-headline); color: var(--text-primary); }

/* ── Loading / Error Screens ── */
.loading-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg-main);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-secondary); font-family: var(--font-body);
}
.loading-spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid var(--sage-light); border-top-color: var(--primary);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-screen { position: fixed; inset: 0; z-index: 9999; background: var(--bg-main); display: flex; align-items: center; justify-content: center; padding: 24px; }
.error-card { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); padding: 40px; text-align: center; max-width: 400px; }
.error-card i { font-size: 48px; color: var(--danger); }
.error-card h4 { margin-top: 16px; }
.error-card p { color: var(--text-secondary); }

/* ── Sidebar ── */
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 1030;
  background: var(--bg-card); border-right: 1px solid var(--border-color);
  display: flex; flex-direction: column; padding: 24px 16px;
}
.sidebar-header { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; }
.app-logo-icon {
  width: 40px; height: 40px; border-radius: var(--radius-sm); overflow: hidden;
  background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
}
.app-logo-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.sidebar-header h5 { margin: 0; font-size: 18px; font-weight: 700; }
.app-subtitle { font-size: 12px; color: var(--text-muted); }

.sidebar-nav { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
.sidebar-nav .nav-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); padding: 16px 12px 6px; font-weight: 600; }
.sidebar-nav .nav-link {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm);
  color: var(--text-secondary); text-decoration: none; font-size: 14.5px; font-weight: 500; margin-bottom: 2px;
}
.sidebar-nav .nav-link i { font-size: 18px; width: 20px; text-align: center; }
.sidebar-nav .nav-link:hover { background: var(--sage-light); color: var(--primary); }
.sidebar-nav .nav-link.active { background: var(--primary); color: #fff; box-shadow: var(--shadow-float); }
[data-theme="dark"] .sidebar-nav .nav-link:hover { background: var(--surface-container); }
[data-theme="dark"] .sidebar-nav .nav-link.active { color: var(--on-primary); background: var(--primary); }

.sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 16px; }
.dark-mode-switch { display: flex; align-items: center; margin-bottom: 12px; }
.dark-mode-switch .form-check-label { font-size: 13px; color: var(--text-secondary); margin-left: 6px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); background: var(--surface-container-low); font-size: 13px; }
.user-chip .avatar-circle { width: 32px; height: 32px; }
.user-chip-info { overflow: hidden; }
.user-chip-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
.user-chip-role { font-size: 11px; color: var(--text-muted); }

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1020; }

/* ── Main content / Topbar ── */
.main-content { margin-left: 260px; min-height: 100vh; padding-bottom: 90px; }
.topbar {
  position: sticky; top: 0; z-index: 1010; background: var(--bg-main);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 18px 28px; border-bottom: 1px solid transparent;
}
.topbar-search { align-items: center; gap: 10px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-full); padding: 9px 18px; width: 320px; color: var(--text-muted); }
.topbar-search input { border: none; outline: none; background: transparent; flex: 1; font-size: 14px; color: var(--text-primary); }
.topbar-right { display: flex; align-items: center; gap: 14px; margin-left: auto; position: relative; }
.icon-btn { background: none; border: none; font-size: 20px; color: var(--text-secondary); padding: 6px; border-radius: var(--radius-sm); }
.icon-btn:hover { background: var(--surface-container-low); }
.topbar-badge-icon { position: relative; font-size: 19px; color: var(--text-secondary); cursor: pointer; background: none; border: none; padding: 6px; border-radius: var(--radius-sm); }
.topbar-badge-icon:hover { background: var(--surface-container-low); }
.badge-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; }
.topbar-user { align-items: center; gap: 10px; }
.topbar-user .avatar-circle { width: 38px; height: 38px; }
.topbar-user-name { font-weight: 600; font-size: 14px; }
.topbar-user-role { font-size: 12px; color: var(--text-muted); }
.btn-quick-attendance {
  background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
}
.btn-quick-attendance:hover { background: var(--primary-container); color: #fff; }

.content-inner { padding: 4px 28px 40px; }
.content-section { display: none; }
.content-section.active { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── Avatar ── */
.avatar-circle {
  width: 48px; height: 48px; border-radius: 50%; background: var(--sage-light); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-headline);
  overflow: hidden; flex-shrink: 0; font-size: 16px;
}
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

/* ── Cards ── */
.card-app {
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  box-shadow: var(--shadow-float); padding: 24px; transition: box-shadow .2s ease, transform .2s ease;
}
.card-app:hover { box-shadow: var(--shadow-float-hover); }
.card-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-container) 100%);
  color: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-float);
}
.card-hero h2 { color: #fff; font-size: 26px; margin-bottom: 6px; }
.card-hero p { color: rgba(255,255,255,.85); margin: 0; max-width: 560px; }

.kpi-card { display: flex; align-items: center; gap: 16px; }
.kpi-icon { width: 48px; height: 48px; border-radius: var(--radius-sm); background: var(--sage-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.kpi-label { font-size: 13px; color: var(--text-muted); margin-bottom: 2px; }
.kpi-value { font-family: var(--font-headline); font-size: 26px; font-weight: 700; }

.section-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.section-subtitle { color: var(--text-muted); font-size: 13.5px; margin-bottom: 20px; }

/* ── Buttons ── */
.btn-primary-app { background: var(--primary); border: none; color: #fff; border-radius: var(--radius-sm); padding: 10px 20px; font-weight: 600; font-size: 14px; }
.btn-primary-app:hover { background: var(--primary-container); color: #fff; }
.btn-outline-app { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); border-radius: var(--radius-sm); padding: 9px 18px; font-weight: 600; font-size: 14px; }
.btn-outline-app:hover { background: var(--sage-light); color: var(--primary); }
.btn-gold-app { background: var(--secondary-gold); border: none; color: #4a3717; border-radius: var(--radius-sm); padding: 10px 20px; font-weight: 700; font-size: 14px; }
.btn-gold-app:hover { filter: brightness(0.95); color: #4a3717; }

/* ── Form Controls ── */
.form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-control, .form-select {
  border: 1.5px solid var(--border-color); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px;
  background: var(--bg-card); color: var(--text-primary);
}
.form-control:focus, .form-select:focus { border-color: var(--leaf-green); box-shadow: 0 0 0 3px rgba(64,145,108,.12); }

/* ── Badges / Chips (pill) ── */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-full); font-size: 12px; font-weight: 600; }
.chip-hadir { background: var(--success-bg); color: var(--success); }
.chip-izin { background: var(--secondary-container); color: var(--secondary-dark); }
.chip-alpha, .chip-sakit { background: var(--danger-bg); color: var(--danger); }
.chip-review-pending { background: var(--secondary-container); color: var(--secondary-dark); }
.chip-review-done { background: var(--success-bg); color: var(--success); }

/* ── Progress bar ── */
.progress-app { height: 8px; border-radius: var(--radius-full); background: var(--sage-light); overflow: hidden; }
.progress-app-fill { height: 100%; background: var(--leaf-green); border-radius: var(--radius-full); }

/* ── Santri Card ── */
.santri-card { display: flex; flex-direction: column; gap: 14px; }
.santri-card-top { display: flex; align-items: center; gap: 12px; }
.santri-card-name { font-family: var(--font-headline); font-weight: 700; font-size: 16px; }
.santri-card-sub { font-size: 12.5px; color: var(--text-muted); }
.santri-target-box { background: var(--surface-container-low); border-radius: var(--radius-sm); padding: 12px 14px; }

/* ── Tables ── */
.table-app { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.table-app th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 10px 14px; border-bottom: 1px solid var(--border-color); }
.table-app td { padding: 12px 14px; border-bottom: 1px solid var(--border-color-soft); vertical-align: middle; }
.table-app tr:last-child td { border-bottom: none; }
.table-responsive-app { overflow-x: auto; }

/* ── Range slider (Penilaian) ── */
.rate-slider-group { margin-bottom: 20px; }
.rate-slider-label { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; margin-bottom: 8px; }
.rate-slider-label .rate-value { color: var(--primary); font-family: var(--font-headline); }
input[type="range"].rate-slider { width: 100%; accent-color: var(--primary); height: 6px; }

.nilai-total-card { background: var(--primary); color: #fff; border-radius: var(--radius-md); padding: 24px; text-align: center; }
.nilai-total-card .label { font-size: 13px; opacity: .85; }
.nilai-total-card .value { font-family: var(--font-headline); font-size: 40px; font-weight: 800; }
.nilai-total-card .grade { display: inline-block; margin-top: 6px; background: rgba(255,255,255,.2); padding: 3px 12px; border-radius: var(--radius-full); font-size: 12.5px; font-weight: 600; }

/* ── Leaderboard ── */
.leaderboard-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius-sm); }
.leaderboard-row:nth-child(odd) { background: var(--surface-container-low); }
.leaderboard-rank { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-headline); background: var(--sage-light); color: var(--primary); flex-shrink: 0; }
.leaderboard-rank.gold { background: #FFD700; color: #4a3717; }
.leaderboard-rank.silver { background: #C0C0C0; color: #333; }
.leaderboard-rank.bronze { background: #CD7F32; color: #fff; }

/* ── Bottom Nav (Mobile) ── */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 1040;
  background: var(--bg-card); border-top: 1px solid var(--border-color);
  justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
}
.bottom-nav .bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--text-muted); font-size: 10.5px; text-decoration: none; padding: 4px 8px; flex: 1; border: none; background: none; }
.bottom-nav .bn-item i { font-size: 20px; }
.bottom-nav .bn-item.active { color: var(--primary); }

.fab-add {
  display: none; position: fixed; bottom: 74px; right: 20px; z-index: 1050;
  width: 54px; height: 54px; border-radius: 50%; background: var(--primary); color: #fff; border: none;
  box-shadow: var(--shadow-float-hover); font-size: 22px; align-items: center; justify-content: center;
}

/* ── Toast ── */
.toast { border-radius: var(--radius-sm); border: 1px solid var(--border-color); }

/* ── Progress mingguan bar chart mini (mobile) ── */
.mini-bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 90px; }
.mini-bar { flex: 1; border-radius: 6px 6px 0 0; background: var(--sage-light); position: relative; }
.mini-bar.today { background: var(--primary); }
.mini-bar-label { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* ── Responsive ── */
@media (max-width: 991.98px) {
  .sidebar { transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow-float-hover); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.show { display: block; }
  .main-content { margin-left: 0; padding-bottom: 100px; }
  .bottom-nav { display: flex; }
  .fab-add { display: flex; }
  .content-inner { padding: 4px 16px 32px; }
  .topbar { padding: 16px; }
}

.empty-state { text-align: center; padding: 48px 16px; color: var(--text-muted); }
.empty-state i { font-size: 40px; color: var(--border-color); margin-bottom: 12px; display: block; }

.filter-panel { position: sticky; top: 90px; }
.toggle-pill-group { display: inline-flex; background: var(--surface-container-low); border-radius: var(--radius-sm); padding: 4px; }
.toggle-pill-group button { border: none; background: none; padding: 8px 16px; border-radius: calc(var(--radius-sm) - 2px); font-size: 13px; font-weight: 600; color: var(--text-muted); }
.toggle-pill-group button.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-float); }

/* ── Pengumuman (dropdown notifikasi + halaman admin) ── */
.notif-panel {
  position: absolute; top: 54px; right: 0; width: 340px; max-width: 90vw; max-height: 420px; overflow-y: auto;
  background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md);
  box-shadow: var(--shadow-float-hover); z-index: 1060; padding: 8px;
}
.notif-item { padding: 12px; border-radius: var(--radius-sm); margin-bottom: 4px; }
.notif-item:hover { background: var(--surface-container-low); }
.notif-item-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
.notif-item-body { font-size: 12.5px; color: var(--text-secondary); white-space: pre-wrap; }
.notif-item-date { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.notif-item-link { font-size: 12px; margin-top: 4px; display: inline-block; }

/* Pastikan HTML/body tidak melebar horizontal di layar sempit (HP) */
html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
</style>
